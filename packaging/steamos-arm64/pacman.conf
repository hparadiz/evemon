[options]
Architecture = aarch64
# Match the Frame: Valve packages carry SHA-256 checksums, with optional signatures.
SigLevel = Optional TrustedOnly
# This is a build container, so do not run system provisioning hooks.
NoExtract = usr/share/libalpm/hooks/*

[deckard-arch-hotfixes-release-0.4]
Server = https://holo-packages.steamos.cloud/archlinux-deckard-hotfixes/release/0.4.x

[core]
Server = https://holo-packages.steamos.cloud/archlinux-deckard/archlinux/pipeline/174308/$repo/os/$arch

[extra]
Server = https://holo-packages.steamos.cloud/archlinux-deckard/archlinux/pipeline/174308/$repo/os/$arch
